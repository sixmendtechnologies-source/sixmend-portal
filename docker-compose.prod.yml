version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sixportal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-sixportal-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sixportal-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ${FRONTEND_IMAGE:-sixportal-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: sixportal-web
    restart: unless-stopped
    networks:
      - internal
      - proxy-net

networks:
  internal:
    driver: bridge
  proxy-net:
    external: true

volumes:
  postgres_data:
