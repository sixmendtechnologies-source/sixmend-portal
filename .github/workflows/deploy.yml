name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_PROJECT: sixportal-be
  FRONTEND_PROJECT: sixportal-fe
  BACKEND_CONTAINER: sixportal-app
  FRONTEND_CONTAINER: sixportal-web
  DEPLOY_DIR: ~/sixmend-portal

jobs:
  # ─── Job 1: Install & build ─────────────────────────────────────────────────
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend — install
        working-directory: backend
        run: npm ci

  # ─── Job 2: Build both images and push to GHCR ──────────────────────────────
  build:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      new-tag: ${{ steps.version.outputs.new_tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PACKAGE_NAME="${{ env.FRONTEND_PROJECT }}"
          SENTINEL="${{ env.FRONTEND_PROJECT }}-v1.1.0"

          LATEST=$(
            (curl -sfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              2>/dev/null ||
            curl -sfL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions" \
              2>/dev/null) \
            | jq -r '.[].metadata.container.tags[]? // empty' \
            | grep -E "^${PACKAGE_NAME}-v[0-9]+\.[0-9]+\.[0-9]+\$" \
            | sort -V \
            | tail -1 \
            || true)

          LATEST=${LATEST:-$SENTINEL}
          echo "Current version: $LATEST"

          VERSION="${LATEST#${PACKAGE_NAME}-v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then patch=1; minor=$((minor + 1)); fi
          if [ "$minor" -ge 10 ]; then minor=1; major=$((major + 1)); fi
          NEW_TAG="v${major}.${minor}.${patch}"
          echo "New version: $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$SENTINEL" ]; then
            echo "previous_tag=${LATEST#${PACKAGE_NAME}-v}" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.BACKEND_PROJECT }}:${{ env.BACKEND_PROJECT }}-${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.FRONTEND_PROJECT }}:${{ env.FRONTEND_PROJECT }}-${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── Job 3: Deploy to server ─────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Get GHCR login token for server
        id: ghcr-token
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Prepare image references
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          NEW_TAG="${{ needs.build.outputs.new-tag }}"
          PREV_TAG="${{ needs.build.outputs.previous-tag }}"

          echo "be_image=ghcr.io/${OWNER}/${{ env.BACKEND_PROJECT }}:${{ env.BACKEND_PROJECT }}-${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "fe_image=ghcr.io/${OWNER}/${{ env.FRONTEND_PROJECT }}:${{ env.FRONTEND_PROJECT }}-${NEW_TAG}" >> $GITHUB_OUTPUT

          if [ -n "$PREV_TAG" ]; then
            echo "prev_be_image=ghcr.io/${OWNER}/${{ env.BACKEND_PROJECT }}:${{ env.BACKEND_PROJECT }}-v${PREV_TAG}" >> $GITHUB_OUTPUT
            echo "prev_fe_image=ghcr.io/${OWNER}/${{ env.FRONTEND_PROJECT }}:${{ env.FRONTEND_PROJECT }}-v${PREV_TAG}" >> $GITHUB_OUTPUT
          else
            echo "prev_be_image=" >> $GITHUB_OUTPUT
            echo "prev_fe_image=" >> $GITHUB_OUTPUT
          fi

      - name: Ensure deploy directories exist
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p ${{ env.DEPLOY_DIR }}/backend/src/db

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: docker-compose.prod.yml,backend/src/db/schema.sql
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH with rollback
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ steps.ghcr-token.outputs.token }}
          GHCR_USER: ${{ github.repository_owner }}
          BE_IMAGE: ${{ steps.images.outputs.be_image }}
          FE_IMAGE: ${{ steps.images.outputs.fe_image }}
          PREV_BE_IMAGE: ${{ steps.images.outputs.prev_be_image }}
          PREV_FE_IMAGE: ${{ steps.images.outputs.prev_fe_image }}
          NEW_TAG: ${{ needs.build.outputs.new-tag }}
          PREV_TAG: ${{ needs.build.outputs.previous-tag }}
          BACKEND_CONTAINER: ${{ env.BACKEND_CONTAINER }}
          FRONTEND_CONTAINER: ${{ env.FRONTEND_CONTAINER }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER,BE_IMAGE,FE_IMAGE,PREV_BE_IMAGE,PREV_FE_IMAGE,NEW_TAG,PREV_TAG,BACKEND_CONTAINER,FRONTEND_CONTAINER,DEPLOY_DIR
          script: |
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            log "Deploying $NEW_TAG  (rollback target: ${PREV_TAG:-none})"

            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            cd "${DEPLOY_DIR/#\~/$HOME}"

            # Update only the image lines in .env, preserving all other vars
            sed -i '/^BACKEND_IMAGE=/d' .env 2>/dev/null || true
            echo "BACKEND_IMAGE=$BE_IMAGE" >> .env
            sed -i '/^FRONTEND_IMAGE=/d' .env 2>/dev/null || true
            echo "FRONTEND_IMAGE=$FE_IMAGE" >> .env

            docker network inspect proxy-net >/dev/null 2>&1 || {
              log "Creating proxy-net network..."
              docker network create proxy-net
            }

            log "Pulling images..."
            if ! docker compose -f docker-compose.prod.yml pull backend frontend; then
              log "ERROR: Pull failed. Deployment aborted — server unchanged."
              docker logout ghcr.io
              exit 1
            fi

            log "Starting containers..."
            if ! docker compose -f docker-compose.prod.yml up -d --no-build; then
              log "ERROR: docker compose up failed — check logs above for details."
              docker logout ghcr.io
              exit 1
            fi

            # Poll both containers — up to 60s (12 × 5s)
            log "Waiting for containers to become running..."
            RESULT="timeout"
            for i in $(seq 1 12); do
              BE_STATUS=$(docker inspect --format='{{.State.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || true)
              FE_STATUS=$(docker inspect --format='{{.State.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || true)
              BE_STATUS="${BE_STATUS:-missing}"
              FE_STATUS="${FE_STATUS:-missing}"
              log "[$i/12] backend=$BE_STATUS  frontend=$FE_STATUS"
              case "$BE_STATUS" in exited|missing|dead) RESULT="crashed"; break ;; esac
              case "$FE_STATUS" in exited|missing|dead) RESULT="crashed"; break ;; esac
              if [ "$BE_STATUS" = "running" ] && [ "$FE_STATUS" = "running" ]; then RESULT="healthy"; break; fi
              sleep 5
            done
            log "Final result: $RESULT"

            if [ "$RESULT" = "healthy" ]; then
              log "Deployment successful — running $NEW_TAG"
              docker exec nginx-proxy nginx -s reload || true
              docker image prune -f
              docker logout ghcr.io
              exit 0
            fi

            # ── ROLLBACK ─────────────────────────────────────────────────────
            log "ROLLBACK TRIGGERED — $NEW_TAG failed (result=$RESULT)"
            log "Last 30 lines from backend:"
            docker logs "$BACKEND_CONTAINER" --tail 30 2>&1 | sed 's/^/  [be] /'
            log "Last 30 lines from frontend:"
            docker logs "$FRONTEND_CONTAINER" --tail 30 2>&1 | sed 's/^/  [fe] /'

            if [ -n "$PREV_BE_IMAGE" ] && [ -n "$PREV_FE_IMAGE" ]; then
              log "Pulling previous images..."
              docker pull "$PREV_BE_IMAGE"
              docker pull "$PREV_FE_IMAGE"
              log "Reverting to $PREV_TAG..."
              sed -i '/^BACKEND_IMAGE=/d' .env 2>/dev/null || true
              echo "BACKEND_IMAGE=$PREV_BE_IMAGE" >> .env
              sed -i '/^FRONTEND_IMAGE=/d' .env 2>/dev/null || true
              echo "FRONTEND_IMAGE=$PREV_FE_IMAGE" >> .env
              docker compose -f docker-compose.prod.yml up -d --no-build
              sleep 5
              BE_RB=$(docker inspect --format='{{.State.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || true)
              FE_RB=$(docker inspect --format='{{.State.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || true)
              log "Rollback status — backend=${BE_RB:-missing}  frontend=${FE_RB:-missing}"
              log "ROLLBACK COMPLETE — serving $PREV_TAG"
            else
              log "No previous version available. Cannot roll back."
            fi

            docker logout ghcr.io
            exit 1
