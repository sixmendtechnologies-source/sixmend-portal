name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 555292118815.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPO: backend
  FRONTEND_REPO: frontend
  BACKEND_PROJECT: sixportal-be
  FRONTEND_PROJECT: sixportal-fe
  BACKEND_CONTAINER: sixportal-api
  FRONTEND_CONTAINER: sixportal-web
  DEPLOY_DIR: ~/sixmend-portal

jobs:
  # ─── Job 1: Install & build ─────────────────────────────────────────────────
  lint-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend — install
        working-directory: backend
        run: npm ci

  # ─── Job 2: Build both images and push to ECR ───────────────────────────────
  docker:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    outputs:
      new-tag: ${{ steps.version.outputs.new_tag }}
      previous-tag: ${{ steps.version.outputs.previous_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve next version
        id: version
        run: |
          # Use frontend ECR repo as the version source of truth
          LATEST=$(aws ecr describe-images \
            --repository-name ${{ env.FRONTEND_REPO }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[].imageTags[]' \
            --output text \
            | tr '\t' '\n' \
            | grep -E '^${{ env.FRONTEND_PROJECT }}-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)

          SENTINEL="${{ env.FRONTEND_PROJECT }}-v1.1.0"
          LATEST=${LATEST:-$SENTINEL}
          echo "Current version: $LATEST"

          VERSION="${LATEST#${{ env.FRONTEND_PROJECT }}-v}"
          IFS='.' read -r major minor patch <<< "$VERSION"
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then patch=1; minor=$((minor + 1)); fi
          if [ "$minor" -ge 10 ]; then minor=1; major=$((major + 1)); fi
          NEW_TAG="v${major}.${minor}.${patch}"
          echo "New version: $NEW_TAG"

          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          if [ "$LATEST" != "$SENTINEL" ]; then
            echo "previous_tag=${LATEST#${{ env.FRONTEND_PROJECT }}-v}" >> $GITHUB_OUTPUT
          else
            echo "previous_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.BACKEND_PROJECT }}-${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.FRONTEND_PROJECT }}-${{ steps.version.outputs.new_tag }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── Job 3: Deploy to server ─────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR login token for server
        id: ecr-token
        run: |
          TOKEN=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Prepare image references
        id: images
        run: |
          NEW_TAG="${{ needs.docker.outputs.new-tag }}"
          PREV_TAG="${{ needs.docker.outputs.previous-tag }}"

          echo "be_image=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.BACKEND_PROJECT }}-${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "fe_image=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.FRONTEND_PROJECT }}-${NEW_TAG}" >> $GITHUB_OUTPUT

          if [ -n "$PREV_TAG" ]; then
            echo "prev_be_image=${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:${{ env.BACKEND_PROJECT }}-v${PREV_TAG}" >> $GITHUB_OUTPUT
            echo "prev_fe_image=${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:${{ env.FRONTEND_PROJECT }}-v${PREV_TAG}" >> $GITHUB_OUTPUT
          else
            echo "prev_be_image=" >> $GITHUB_OUTPUT
            echo "prev_fe_image=" >> $GITHUB_OUTPUT
          fi

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: mkdir -p ${{ env.DEPLOY_DIR }}

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: docker-compose.prod.yml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy via SSH with rollback
        uses: appleboy/ssh-action@v1
        env:
          ECR_TOKEN: ${{ steps.ecr-token.outputs.token }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          BE_IMAGE: ${{ steps.images.outputs.be_image }}
          FE_IMAGE: ${{ steps.images.outputs.fe_image }}
          PREV_BE_IMAGE: ${{ steps.images.outputs.prev_be_image }}
          PREV_FE_IMAGE: ${{ steps.images.outputs.prev_fe_image }}
          NEW_TAG: ${{ needs.docker.outputs.new-tag }}
          PREV_TAG: ${{ needs.docker.outputs.previous-tag }}
          BACKEND_CONTAINER: ${{ env.BACKEND_CONTAINER }}
          FRONTEND_CONTAINER: ${{ env.FRONTEND_CONTAINER }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: ECR_TOKEN,ECR_REGISTRY,BE_IMAGE,FE_IMAGE,PREV_BE_IMAGE,PREV_FE_IMAGE,NEW_TAG,PREV_TAG,BACKEND_CONTAINER,FRONTEND_CONTAINER,DEPLOY_DIR
          script: |
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            log "Deploying $NEW_TAG  (rollback target: ${PREV_TAG:-none})"

            echo "$ECR_TOKEN" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd "${DEPLOY_DIR/#\~/$HOME}"

            log "Pulling images..."
            export BACKEND_IMAGE="$BE_IMAGE"
            export FRONTEND_IMAGE="$FE_IMAGE"
            if ! docker compose -f docker-compose.prod.yml pull backend frontend; then
              log "ERROR: Pull failed. Deployment aborted — server unchanged."
              docker logout "$ECR_REGISTRY"
              exit 1
            fi

            log "Starting containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

            # Poll both containers — up to 60s (12 × 5s)
            log "Waiting for containers to become running..."
            RESULT="timeout"
            for i in $(seq 1 12); do
              BE_STATUS=$(docker inspect --format='{{.State.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || echo "missing")
              FE_STATUS=$(docker inspect --format='{{.State.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo "missing")
              log "[$i/12] backend=$BE_STATUS  frontend=$FE_STATUS"
              if [ "$BE_STATUS" = "exited" ] || [ "$BE_STATUS" = "missing" ]; then RESULT="crashed"; break; fi
              if [ "$FE_STATUS" = "exited" ] || [ "$FE_STATUS" = "missing" ]; then RESULT="crashed"; break; fi
              if [ "$BE_STATUS" = "running" ] && [ "$FE_STATUS" = "running" ]; then RESULT="healthy"; break; fi
              sleep 5
            done
            log "Final result: $RESULT"

            if [ "$RESULT" = "healthy" ]; then
              log "Deployment successful — running $NEW_TAG"
              docker exec nginx-proxy nginx -s reload || true
              docker image prune -f
              docker logout "$ECR_REGISTRY"
              exit 0
            fi

            # ── ROLLBACK ─────────────────────────────────────────────────────
            log "ROLLBACK TRIGGERED — $NEW_TAG failed (result=$RESULT)"
            log "Last 30 lines from backend:"
            docker logs "$BACKEND_CONTAINER" --tail 30 2>&1 | sed 's/^/  [be] /'
            log "Last 30 lines from frontend:"
            docker logs "$FRONTEND_CONTAINER" --tail 30 2>&1 | sed 's/^/  [fe] /'

            if [ -n "$PREV_BE_IMAGE" ] && [ -n "$PREV_FE_IMAGE" ]; then
              log "Pulling previous images..."
              docker pull "$PREV_BE_IMAGE"
              docker pull "$PREV_FE_IMAGE"
              log "Reverting to $PREV_TAG..."
              export BACKEND_IMAGE="$PREV_BE_IMAGE"
              export FRONTEND_IMAGE="$PREV_FE_IMAGE"
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build
              sleep 5
              BE_RB=$(docker inspect --format='{{.State.Status}}' "$BACKEND_CONTAINER" 2>/dev/null || echo "missing")
              FE_RB=$(docker inspect --format='{{.State.Status}}' "$FRONTEND_CONTAINER" 2>/dev/null || echo "missing")
              log "Rollback status — backend=$BE_RB  frontend=$FE_RB"
              log "ROLLBACK COMPLETE — serving $PREV_TAG"
            else
              log "No previous version available. Cannot roll back."
            fi

            docker logout "$ECR_REGISTRY"
            exit 1
