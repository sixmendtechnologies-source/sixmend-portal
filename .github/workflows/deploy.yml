name: Build & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 555292118815.dkr.ecr.ap-south-1.amazonaws.com
  BACKEND_REPO: backend
  FRONTEND_REPO: frontend
  DEPLOY_DIR: ~/sixportal

jobs:
  # ─── Job 1: Install deps and build ──────────────────────────────────────────
  lint-build:
    name: Install & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend — install
        working-directory: backend
        run: npm ci

  # ─── Job 2: Build both images and push to ECR ───────────────────────────────
  docker:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: lint-build
    permissions:
      id-token: write
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      backend_image: ${{ steps.version.outputs.backend_image }}
      frontend_image: ${{ steps.version.outputs.frontend_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute next semver
        id: version
        run: |
          # Query ECR frontend repo for existing sixportal-web-vX.Y.Z tags (canonical version source)
          TAGS=$(aws ecr list-images \
            --repository-name "${{ env.FRONTEND_REPO }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageIds[*].imageTag' \
            --output text 2>/dev/null || echo "")

          LATEST=$(echo "$TAGS" | tr '\t' '\n' | grep '^sixportal-fe-v' | \
            sed 's/sixportal-fe-v//' | \
            sort -t. -k1,1n -k2,2n -k3,3n | \
            tail -1)

          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          VERSION="v${NEXT}"
          BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPO }}:sixportal-be-${VERSION}"
          FRONTEND_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPO }}:sixportal-fe-${VERSION}"

          echo "version=${VERSION}"         >> "$GITHUB_OUTPUT"
          echo "backend_image=${BACKEND_IMAGE}"   >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.version.outputs.backend_image }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.version.outputs.frontend_image }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ─── Job 3: SSH into server and deploy ──────────────────────────────────────
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          BACKEND_IMAGE: ${{ needs.docker.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker.outputs.frontend_image }}
          VERSION: ${{ needs.docker.outputs.version }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,BACKEND_IMAGE,FRONTEND_IMAGE,VERSION,DEPLOY_DIR
          script: |
            set -e

            # Authenticate with ECR
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            cd "$DEPLOY_DIR"

            # Pull latest code (schema migrations, compose file updates)
            git pull origin main

            # Save current image tags for rollback
            PREV_BACKEND=$(docker inspect sixportal-api --format '{{.Config.Image}}' 2>/dev/null || echo "")
            PREV_FRONTEND=$(docker inspect sixportal-web --format '{{.Config.Image}}' 2>/dev/null || echo "")

            # Pull new images from ECR
            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # Recreate only the changed containers (postgres is untouched)
            BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" \
              docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build

            # Health check — /api/health must respond 200 within 60s (12 × 5s)
            echo "Running health check..."
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(docker inspect --format '{{.State.Status}}' sixportal-api 2>/dev/null || echo "missing")
              if [ "$STATUS" = "running" ]; then
                if docker exec sixportal-api node -e "
                  const http = require('http');
                  http.get('http://localhost:4000/api/health', (r) => {
                    process.exit(r.statusCode === 200 ? 0 : 1);
                  }).on('error', () => process.exit(1));
                " 2>/dev/null; then
                  HEALTHY=true
                  break
                fi
              fi
              echo "Attempt $i/12 — not healthy yet, retrying..."
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "Health check failed — rolling back to previous images"
              if [ -n "$PREV_BACKEND" ] && [ -n "$PREV_FRONTEND" ]; then
                BACKEND_IMAGE="$PREV_BACKEND" FRONTEND_IMAGE="$PREV_FRONTEND" \
                  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-build
                echo "Rollback complete. Previous backend: $PREV_BACKEND"
                echo "                  Previous frontend: $PREV_FRONTEND"
              else
                echo "No previous images to roll back to — manual intervention required."
              fi
              docker logout "$ECR_REGISTRY"
              exit 1
            fi

            echo "Health check passed!"

            # Reload nginx to pick up any conf changes
            docker exec nginx-proxy nginx -s reload || true

            # Remove dangling images to free disk space
            docker image prune -f

            docker logout "$ECR_REGISTRY"
            echo "Deployment complete. Version: $VERSION"
